[project]
name = "preflight"
version = "0.1.0"
description = "Screens health and supplement ads against the GB register, the CAP Code and past ASA rulings."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "openai>=1.60",
    "openpyxl>=3.1.5",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]
fixtures = [
    "piper-tts>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preflight"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real Meta Model API; run with -m live"]
