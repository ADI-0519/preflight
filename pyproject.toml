[project]
name = "preflight"
version = "0.1.0"
description = "Screens health and supplement ads against the GB register, the CAP Code and past ASA rulings."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "openai>=1.60",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preflight"]
