[project]
name = "preflight"
version = "0.1.0"
description = "Screens health and supplement ads against the GB register, the CAP Code and past ASA rulings."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "openai>=1.60",
    "openpyxl>=3.1.5",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
]

[project.scripts]
preflight = "preflight.cli:main"

[project.optional-dependencies]
page = ["playwright>=1.48"]
align = [
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
]
render = ["piper-tts>=1.8.0"]
mcp = ["mcp>=1.2,<2"]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preflight"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real Meta Model API; run with -m live"]
